<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual MATLAB engineering computation graphic</title>
  <desc id="desc">A code editor, matrix, numerical method flow, and computed plot.</desc>
  <rect width="1200" height="700" fill="#0d1d2b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="82" fill="#78ddb9" font-size="25" font-weight="700" letter-spacing="3">CONCEPTUAL WORKFLOW</text>
    <text x="70" y="126" fill="#f3f6f5" font-size="42" font-weight="700">Engineering Computation</text>
    <g transform="translate(70 180)">
      <rect width="525" height="410" rx="20" fill="#152b3b" stroke="#365464" stroke-width="2"/>
      <circle cx="30" cy="30" r="8" fill="#78ddb9"/><circle cx="58" cy="30" r="8" fill="#f3b14a"/><circle cx="86" cy="30" r="8" fill="#7892a1"/>
      <line x1="0" y1="60" x2="525" y2="60" stroke="#365464" stroke-width="2"/>
      <g font-family="Consolas, Menlo, monospace" font-size="23">
        <text x="32" y="108" fill="#78ddb9">function</text><text x="150" y="108" fill="#f3f6f5">x = solveSystem(A,b)</text>
        <text x="32" y="150" fill="#7892a1">% verify input dimensions</text>
        <text x="32" y="192" fill="#f3b14a">if</text><text x="68" y="192" fill="#f3f6f5">rank(A) == size(A,1)</text>
        <text x="60" y="234" fill="#f3f6f5">[L,U] = lu(A);</text>
        <text x="60" y="276" fill="#f3f6f5">y = L \ b;</text>
        <text x="60" y="318" fill="#f3f6f5">x = U \ y;</text>
        <text x="32" y="360" fill="#f3b14a">end</text>
      </g>
    </g>
    <g transform="translate(645 180)">
      <rect width="485" height="170" rx="20" fill="#f5f7f6"/>
      <text x="35" y="44" fill="#254138" font-size="20" font-weight="700">INPUT → METHOD → VERIFIED OUTPUT</text>
      <text x="48" y="115" fill="#1a3f35" font-size="36">[ A ]</text>
      <path d="M155 100 H230" stroke="#1f765f" stroke-width="6"/>
      <path d="M215 84 L235 100 L215 116" fill="none" stroke="#1f765f" stroke-width="6"/>
      <text x="260" y="115" fill="#1a3f35" font-size="34">LU</text>
      <path d="M335 100 H395" stroke="#1f765f" stroke-width="6"/>
      <path d="M380 84 L400 100 L380 116" fill="none" stroke="#1f765f" stroke-width="6"/>
      <text x="420" y="115" fill="#1a3f35" font-size="36">x</text>
    </g>
    <g transform="translate(645 385)">
      <rect width="485" height="205" rx="20" fill="#f5f7f6"/>
      <line x1="55" y1="155" x2="430" y2="155" stroke="#617178" stroke-width="3"/>
      <line x1="55" y1="35" x2="55" y2="155" stroke="#617178" stroke-width="3"/>
      <polyline points="58,142 100,128 145,115 190,93 235,82 280,58 325,70 370,40 425,48" fill="none" stroke="#1f765f" stroke-width="7"/>
      <g fill="#f3b14a"><circle cx="100" cy="128" r="7"/><circle cx="190" cy="93" r="7"/><circle cx="280" cy="58" r="7"/><circle cx="370" cy="40" r="7"/></g>
      <text x="245" y="187" text-anchor="middle" fill="#254138" font-size="19" font-weight="700">Computed result + test cases</text>
    </g>
  </g>
</svg>
